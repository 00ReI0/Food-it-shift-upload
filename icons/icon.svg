<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="50%" stop-color="#1b2a4a" />
      <stop offset="100%" stop-color="#243b55" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with subtle rounded corners for adaptive icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular Japanese Mon pattern border -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Calendar card element -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="116" y="128" width="280" height="260" rx="32" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <rect x="116" y="128" width="280" height="74" rx="32" fill="url(#goldGrad)" />
    <!-- Fix rounded bottom corners of top header -->
    <rect x="116" y="172" width="280" height="30" fill="url(#goldGrad)" />
    
    <!-- Calendar Rings -->
    <rect x="176" y="106" width="20" height="44" rx="10" fill="#ffffff" />
    <rect x="316" y="106" width="20" height="44" rx="10" fill="#ffffff" />
    
    <!-- Japanese Kanzi / Modern Monogram: '時' or 'S' Flow -->
    <path d="M216 250 C216 230, 296 230, 296 260 C296 295, 216 285, 216 325 C216 355, 300 355, 300 330" 
          fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
          
    <circle cx="206" cy="286" r="8" fill="#ffe259" />
    <circle cx="306" cy="290" r="8" fill="#ffa751" />
  </g>
  
  <!-- Tiny subtle sparkle -->
  <polygon points="372,210 380,224 394,232 380,240 372,254 364,240 350,232 364,224" fill="#ffffff" fill-opacity="0.7" />
</svg>
